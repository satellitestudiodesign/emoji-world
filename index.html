<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emoji World</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: black; }
    /* Hidden but interactive: receives all mouse/touch input, emojis are drawn on top */
    #map { position: fixed; inset: 0; opacity: 0; }
    body.debug #map { opacity: .5; }
    body.raw #map { opacity: 1; } body.raw #grid { visibility: hidden; } /* space: see the hidden class map */
    #grid { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; } /* input falls through to the map */
    /* invisible controls over their grid cells (ui.js draws them on the grid) */
    .ctl { position: fixed; margin: 0; padding: 0; border: 0; background: none; color: transparent; cursor: pointer; }
    input.ctl { cursor: text; caret-color: transparent; outline: none; font-size: 16px; } /* 16px: no iOS zoom on focus */
    #fps, #credits { position: fixed; bottom: 0; margin: 5px; color: white; font: 11px sans-serif; }
    #fps { right: 0; }
    #credits { left: 0; opacity: .6; }
    #credits a { color: inherit; }
  </style>
</head>
<body>
  <div id="map"></div>
  <canvas id="grid"></canvas>
